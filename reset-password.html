<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Sistem HR Al Fatih</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
  data-page="reset-password"
  class="min-h-screen bg-stone-950 grid place-items-center p-5"
>
  <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">

    <p class="text-xs font-bold tracking-widest text-amber-700 uppercase">
      Direktorat SDM / HRD
    </p>

    <h1 class="mt-3 text-2xl font-bold text-stone-900">
      Buat Password Baru
    </h1>

    <p class="mt-2 text-sm text-stone-500">
      Masukkan password baru untuk akun Anda.
    </p>

    <form id="resetPasswordForm" class="mt-7 space-y-4">

      <label class="block text-sm font-medium text-stone-800">
        Password Baru
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          required
          class="mt-1 w-full rounded-lg border border-stone-300 p-3"
          autocomplete="new-password"
        >
      </label>

      <label class="block text-sm font-medium text-stone-800">
        Ulangi Password Baru
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          required
          class="mt-1 w-full rounded-lg border border-stone-300 p-3"
          autocomplete="new-password"
        >
      </label>

      <p id="resetMessage" class="text-sm"></p>

      <button
        id="resetButton"
        type="submit"
        class="w-full rounded-lg bg-amber-600 p-3 font-semibold text-white hover:bg-amber-700"
      >
        Simpan Password Baru
      </button>

    </form>

  </main>

  <script type="module" src="./auth.js"></script>

  <script>
  const form = document.getElementById('resetPasswordForm');
  const newPassword = document.getElementById('newPassword');
  const confirmPassword = document.getElementById('confirmPassword');
  const message = document.getElementById('resetMessage');
  const button = document.getElementById('resetButton');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    message.textContent = '';
    message.className = 'text-sm';

    if (newPassword.value !== confirmPassword.value) {
      message.textContent = 'Password baru dan konfirmasi password tidak sama.';
      message.classList.add('text-red-700');
      return;
    }

    button.disabled = true;
    button.textContent = 'Menyimpan...';

    try {
      const { error } = await window.HRDAuth.updatePassword(newPassword.value);

      if (error) {
        throw error;
      }

      message.textContent = 'Password berhasil diperbarui. Mengarahkan ke halaman login...';
      message.classList.add('text-green-700');

      await window.HRDAuth.signOut();

    } catch (error) {
      console.error('Reset password error:', error);

      message.textContent =
        error.message || 'Password gagal diperbarui. Silakan coba lagi.';

      message.classList.add('text-red-700');

      button.disabled = false;
      button.textContent = 'Simpan Password Baru';
    }
  });
  </script>

</body>
</html>
